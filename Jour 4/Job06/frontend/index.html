<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Docker</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #0f172a;
      --panel: #111827;
      --accent: #38bdf8;
      --text: #e5e7eb;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0, var(--bg) 55%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(720px, 100%);
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(2rem, 4vw, 3rem);
    }

    .status {
      margin-top: 20px;
      padding: 20px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .label {
      color: var(--muted);
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .value {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>Bienvenue sur votre projet multi-conteneurs Docker</h1>
    <p>Le frontend interroge le backend via Nginx et affiche l'état de l'API.</p>

    <section class="status">
      <div class="label">API status</div>
      <div class="value" id="status">Chargement...</div>
    </section>
  </main>

  <script>
    fetch('/api/status')
      .then((response) => {
        if (!response.ok) {
          throw new Error('API inaccessible');
        }

        return response.json();
      })
      .then((data) => {
        document.getElementById('status').textContent = `En ligne : ${data.currentTime}`;
      })
      .catch((error) => {
        console.error(error);
        document.getElementById('status').textContent = 'API inaccessible';
      });
  </script>
</body>
</html>
